name: Build test installers

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG · Apple silicon
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SEAMLESS_SIGNING_IDENTITY: '-'
      SEAMLESS_REQUIRE_NATIVE_ICON: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify build environment and source privacy
        run: |
          test "$(uname -m)" = arm64
          swift --version
          python3 scripts/check-source-privacy.py
      - name: Run native tests
        run: sh scripts/test-macos.sh
      - name: Build native app
        run: sh scripts/build-macos.sh
      - name: Package and verify disk image
        run: sh scripts/package-macos.sh
      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 ./*.dmg > SHA256SUMS-macos.txt
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Seamless-macos-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    name: Android APK · development signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Check source privacy
        run: python3 scripts/check-source-privacy.py
      - name: Build, test and lint companion
        run: sh scripts/build-android.sh
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS-android.txt
      - name: Upload APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Seamless-android-debug
          path: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-failure-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
